[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "variant-liftover-explorer"
version = "0.1.0"
description = "Cross-reference variant liftover and gene-burden explanation workflow"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["matplotlib==3.11.1"]
keywords = ["bioinformatics", "variant-liftover", "comparative-genomics"]
license = "MIT"

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.urls]
Repository = "https://github.com/pankhilpandya01-star/bioinformatics-project-16-cross-reference-variant-liftover-gene-burden-explorer"

[project.scripts]
variant-liftover-explorer = "variant_liftover_explorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
