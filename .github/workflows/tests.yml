name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
      PYTHONHASHSEED: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create pinned environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          cache-environment: true
          post-cleanup: all

      - name: Verify tools and install package
        shell: bash -el {0}
        run: |
          python --version
          minimap2 --version
          bcftools --version
          samtools --version
          python -m pip install --no-build-isolation --no-deps .
          variant-liftover-explorer --version

      - name: Run offline test suite
        shell: bash -el {0}
        run: python -m pytest -q -p no:cacheprovider
